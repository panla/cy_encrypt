[project]
name = "cy-encrypt"
version = "0.2.0"
description = "Use Cython Encrypt Source Code"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
    { name = "panla", email = "pankla@163.com" }
]
keywords = ["Cython", "DDL", "cy_encrypt", "CythonEncrypt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "Cython>=3.1.0,<3.2.0",
    "click>=8.0,<9.0",
    "setuptools>=68.0",
]

[project.scripts]
cy_encrypt = "cy_encrypt.cli:main"

[project.urls]
Repository = "https://gitee.com/pankla/cy_encrypt.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
# 保持默认源配置

[tool.hatch.build.targets.wheel]
packages = ["cy_encrypt"]

[tool.hatch.build.targets.sdist]
include = ["cy_encrypt", "CHANGELOG.md", "LICENSE", "README.md"]
